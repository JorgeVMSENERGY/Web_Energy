name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-pr:
    name: PR offline validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner and PR history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python --version
          git --version
          docker version
          test "$(uname -m)" = x86_64
          test "$(git rev-parse --is-shallow-repository)" = false
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git merge-base "$BASE_SHA" "$HEAD_SHA"

      - name: Diagnose PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Prefer the validator already reviewed on the base branch.
          if git cat-file -e "$BASE_SHA:scripts/validate_pr_diff.py"; then
            git show "$BASE_SHA:scripts/validate_pr_diff.py" > "$RUNNER_TEMP/validate_pr_diff.py"
            python "$RUNNER_TEMP/validate_pr_diff.py"
          else
            echo '::warning::Bootstrap validation: no trusted validator on base. Independent review required.'
            python scripts/validate_pr_diff.py
          fi

      - name: Prepare isolated test image
        run: |
          docker build -t pr-offline - <<'DOCKERFILE'
          FROM python:3.12-slim
          RUN apt-get update && apt-get install -y --no-install-recommends git curl unzip nodejs && rm -rf /var/lib/apt/lists/*
          RUN curl --fail --silent --show-error --location https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.36.42.zip -o /tmp/aws.zip && unzip -q /tmp/aws.zip -d /tmp && /tmp/aws/install && rm -rf /tmp/aws /tmp/aws.zip
          RUN pip install --no-cache-dir boto3==1.37.38 PyYAML==6.0.3 esprima==4.0.1
          ENV AWS_EC2_METADATA_DISABLED=true PYTHONDONTWRITEBYTECODE=1
          WORKDIR /repo
          DOCKERFILE

      - name: Run scripts and forms without external network
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/repo,readonly \
            --env PR_OFFLINE_STRICT=1 --env BASE_SHA pr-offline sh -ec '
              python --version
              git --version
              aws --version
              python -m pip check
              python -m pip show boto3 botocore PyYAML esprima
              node --version
              seo_present=0
              seo_required=0

              for path in \
                scripts/build_seo_redirects.py \
                scripts/test_seo_routing.cjs \
                scripts/test_seo_contract.py \
                scripts/seo/unified-viewer-request.js.template \
                infra/site/functions/legacy-redirects.json \
                infra/site/functions/unified-viewer-request.js
              do
                if [ -f "$path" ]; then
                  seo_present=$((seo_present + 1))
                fi
              done

              : "${BASE_SHA:?BASE_SHA_REQUIRED}"
              git -c safe.directory=/repo cat-file -e "$BASE_SHA^{commit}"

              seo_base_entry=$(git -c safe.directory=/repo ls-tree "$BASE_SHA" -- scripts/test_seo_contract.py)

              if [ -n "$seo_base_entry" ]; then
                seo_required=1
              fi

              if [ "$seo_present" -eq 6 ]; then
                python -B scripts/build_seo_redirects.py --check
                node scripts/test_seo_routing.cjs
                echo "SEO_CI=PASS"
              elif [ "$seo_present" -eq 0 ] && [ "$seo_required" -eq 0 ]; then
                echo "SEO_CI=NOT_INTRODUCED"
              else
                echo "SEO_CI=INCOMPLETE_OR_REMOVED" >&2
                exit 1
              fi

              exec python scripts/run_pr_offline.py
            '
