name: Audit SEO release contract promotion
'on':
  push:
    branches:
    - audit/seo-release-contract-20261126
    paths:
    - .github/workflows/audit-seo-release-contract.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ac113d37df0b71a5c0c0ebbe75aae9cc62b8c571
      HEAD_SHA: cac9324625e168044756c06d6c4c938ba2886036
    steps:
    - name: Checkout exact contract candidate
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: cac9324625e168044756c06d6c4c938ba2886036
    - name: Verify immutable audit inputs
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$HEAD_SHA"

        test "$(git rev-parse HEAD^)" = "$BASE_SHA"

        test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" = "scripts/test_seo_contract.py"

        sha256sum infra/site/functions/unified-viewer-request.js

        echo "AUDIT_CANDIDATE=PASS"

        '
    - name: Prepare isolated test image
      run: 'docker build -t pr-offline - <<''DOCKERFILE''

        FROM python:3.12-slim

        RUN apt-get update && apt-get install -y --no-install-recommends git curl unzip nodejs && rm -rf /var/lib/apt/lists/*

        RUN curl --fail --silent --show-error --location https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.36.42.zip
        -o /tmp/aws.zip && unzip -q /tmp/aws.zip -d /tmp && /tmp/aws/install && rm -rf /tmp/aws /tmp/aws.zip

        RUN pip install --no-cache-dir boto3==1.37.38 PyYAML==6.0.3 esprima==4.0.1

        ENV AWS_EC2_METADATA_DISABLED=true PYTHONDONTWRITEBYTECODE=1

        WORKDIR /repo

        DOCKERFILE

        '
    - name: Run scripts and forms without external network
      run: "docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \\\n  --mount type=bind,src=\"\
        $GITHUB_WORKSPACE\",dst=/repo,readonly \\\n  --env PR_OFFLINE_STRICT=1 --env BASE_SHA pr-offline sh -ec '\n    python\
        \ --version\n    git --version\n    aws --version\n    python -m pip check\n    python -m pip show boto3 botocore\
        \ PyYAML esprima\n    node --version\n    seo_present=0\n    seo_required=0\n\n    for path in \\\n      scripts/build_seo_redirects.py\
        \ \\\n      scripts/test_seo_routing.cjs \\\n      scripts/test_seo_contract.py \\\n      scripts/seo/unified-viewer-request.js.template\
        \ \\\n      infra/site/functions/legacy-redirects.json \\\n      infra/site/functions/unified-viewer-request.js\n\
        \    do\n      if [ -f \"$path\" ]; then\n        seo_present=$((seo_present + 1))\n      fi\n    done\n\n    : \"\
        ${BASE_SHA:?BASE_SHA_REQUIRED}\"\n    git -c safe.directory=/repo cat-file -e \"$BASE_SHA^{commit}\"\n\n    seo_base_entry=$(git\
        \ -c safe.directory=/repo ls-tree \"$BASE_SHA\" -- scripts/test_seo_contract.py)\n\n    if [ -n \"$seo_base_entry\"\
        \ ]; then\n      seo_required=1\n    fi\n\n    if [ \"$seo_present\" -eq 6 ]; then\n      python -B scripts/build_seo_redirects.py\
        \ --check\n      node scripts/test_seo_routing.cjs\n      echo \"SEO_CI=PASS\"\n    elif [ \"$seo_present\" -eq 0\
        \ ] && [ \"$seo_required\" -eq 0 ]; then\n      echo \"SEO_CI=NOT_INTRODUCED\"\n    else\n      echo \"SEO_CI=INCOMPLETE_OR_REMOVED\"\
        \ >&2\n      exit 1\n    fi\n\n    exec python scripts/run_pr_offline.py\n  '\n"
