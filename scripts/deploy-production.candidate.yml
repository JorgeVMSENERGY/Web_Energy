# CANDIDATE ONLY — DO NOT PLACE UNDER .github/workflows WITHOUT SEPARATE APPROVAL.
name: Deploy production to AWS (incremental candidate)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: vms-energy-web-production
  cancel-in-progress: false

jobs:
  plan:
    name: Plan website changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy_required: ${{ steps.plan.outputs.deploy_required }}
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve last successful production deployment
        id: baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Result = @(& python3 -B scripts/incremental_baseline.py `
            --repo . --current $env:GITHUB_SHA `
            --current-run-id $env:GITHUB_RUN_ID)
          if ($LASTEXITCODE -ne 0 -or $Result.Count -ne 1 -or
              $Result[0] -cnotmatch '^[0-9a-f]{40}$') {
            throw 'BASELINE_RESOLUTION_FAILED'
          }
          "previous=$($Result[0])" >> $env:GITHUB_OUTPUT
          Write-Host "Confirmed prior deployed commit: $($Result[0])"

      - name: Plan offline SHA-256 changes
        id: plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Report = Join-Path $env:RUNNER_TEMP 'incremental-plan.json'
          & python3 -B scripts/incremental_deploy.py plan `
            --repo . --previous '${{ steps.baseline.outputs.previous }}' `
            --current $env:GITHUB_SHA --output $Report
          if ($LASTEXITCODE -ne 0) { throw 'INCREMENTAL_PLAN_FAILED' }
          $P = ConvertFrom-Json -InputObject (Get-Content $Report -Raw)
          if ($P.status -eq 'BLOCKED') { throw "PLAN_BLOCKED: $($P.blockers -join ',')" }
          if ($P.status -eq 'NO-OP') {
            "deploy_required=false" >> $env:GITHUB_OUTPUT
            Write-Host 'NO-OP: No AWS credentials, transfers or invalidations needed.'
          }
          elseif ($P.status -eq 'PROPOSED') {
            if ($P.counts.DELETE -ne 0) { throw 'DELETE_NOT_ALLOWED' }
            "deploy_required=true" >> $env:GITHUB_OUTPUT
          }
          else { throw 'INVALID_PLAN_STATUS' }

      - name: Upload validated plan for deploy job
        if: steps.plan.outputs.deploy_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: incremental-plan
          path: ${{ runner.temp }}/incremental-plan.json
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy changed website files
    needs: plan
    if: needs.plan.outputs.deploy_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://d34jb94w5ivknd.cloudfront.net/
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated plan
        uses: actions/download-artifact@v4
        with:
          name: incremental-plan
          path: ${{ runner.temp }}

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::787140332697:role/VMSWebGitHubProductionDeploy
          role-session-name: VMSWebProduction-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: us-east-1
          audience: sts.amazonaws.com
          mask-aws-account-id: true

      - name: Upload and verify changed objects; invalidate cache
        shell: pwsh
        run: |
          & python3 -B scripts/incremental_deploy.py apply `
            --repo . `
            --plan (Join-Path $env:RUNNER_TEMP 'incremental-plan.json')
          if ($LASTEXITCODE -ne 0) { throw 'INCREMENTAL_DEPLOY_FAILED' }

      - name: Verify CloudFront
        shell: pwsh
        run: |
          $R = Invoke-WebRequest -Uri 'https://d34jb94w5ivknd.cloudfront.net/' -Method Head
          if ($R.StatusCode -ne 200) { throw "CloudFront HTTP $($R.StatusCode)" }
